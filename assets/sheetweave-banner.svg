<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SheetWeave banner</title>
  <desc id="desc">Tiled drawing PDF pages are organized into one complete vector PDF plan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1720"/>
      <stop offset="0.58" stop-color="#12352F"/>
      <stop offset="1" stop-color="#1F7A6D"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FCF8"/>
      <stop offset="1" stop-color="#D8EEE5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFE2A6"/>
      <stop offset="1" stop-color="#F1C376"/>
    </linearGradient>
    <filter id="shadow" x="-16%" y="-20%" width="132%" height="146%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#061014" flood-opacity="0.26"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1.5 1.5L7.4 4.5L1.5 7.5" stroke="#FFE2A6" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="34" fill="url(#bg)"/>
  <path d="M610 48C730 30 846 38 958 72C1053 101 1127 102 1200 76" stroke="#F8FCF8" stroke-width="1.5" stroke-opacity="0.14"/>
  <path d="M628 306C746 264 854 260 970 290C1062 314 1130 302 1200 270" stroke="#FFE2A6" stroke-width="1.5" stroke-opacity="0.18"/>
  <path d="M0 300C170 268 302 288 440 252C552 222 642 222 730 240V360H0V300Z" fill="#F8FCF8" fill-opacity="0.05"/>

  <text x="72" y="122" fill="#F8FCF8" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700">SheetWeave</text>
  <text x="77" y="165" fill="#FFE2A6" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">VECTOR PDF DRAWING STITCHING SKILL</text>
  <text x="76" y="218" fill="#D8EEE5" font-family="Segoe UI, Arial, sans-serif" font-size="24">Recover layout from tiled drawing sheets.</text>
  <text x="76" y="254" fill="#D8EEE5" font-family="Segoe UI, Arial, sans-serif" font-size="24">Export the merged plan as a vector PDF.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="76" y="292" width="176" height="40" rx="20" fill="#F8FCF8" fill-opacity="0.13" stroke="#F8FCF8" stroke-opacity="0.28"/>
    <text x="104" y="318" fill="#F8FCF8">overview-aware</text>
    <rect x="270" y="292" width="146" height="40" rx="20" fill="#F8FCF8" fill-opacity="0.13" stroke="#F8FCF8" stroke-opacity="0.28"/>
    <text x="298" y="318" fill="#F8FCF8">vector-first</text>
    <rect x="434" y="292" width="142" height="40" rx="20" fill="#F8FCF8" fill-opacity="0.13" stroke="#F8FCF8" stroke-opacity="0.28"/>
    <text x="462" y="318" fill="#F8FCF8">reviewable</text>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(682 96)">
      <rect x="0" y="0" width="92" height="64" rx="10" fill="url(#tile)" stroke="#D3E8DF"/>
      <rect x="0" y="82" width="92" height="64" rx="10" fill="url(#tile)" stroke="#D3E8DF"/>
      <rect x="110" y="0" width="92" height="64" rx="10" fill="url(#tile)" stroke="#D3E8DF"/>
      <rect x="110" y="82" width="92" height="64" rx="10" fill="url(#tile)" stroke="#D3E8DF"/>
      <g stroke="#1F7A6D" stroke-width="3" stroke-linecap="round" opacity="0.78">
        <path d="M16 20H72M16 34H58"/>
        <path d="M16 102H72M16 116H54"/>
        <path d="M126 20H182M126 34H164"/>
        <path d="M126 102H182M126 116H168"/>
      </g>
      <path d="M46 72V76M156 72V76M101 32H109M101 114H109" stroke="#FFE2A6" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g transform="translate(920 78)">
      <rect x="0" y="0" width="208" height="180" rx="18" fill="#F8FCF8"/>
      <rect x="20" y="20" width="168" height="122" rx="10" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="3"/>
      <path d="M42 46H164M42 70H164M42 94H92M106 94H164M42 118H164" stroke="#1F7A6D" stroke-width="4" stroke-linecap="round" opacity="0.72"/>
      <rect x="132" y="126" width="62" height="38" rx="8" fill="url(#gold)"/>
      <text x="145" y="151" fill="#0B1720" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">PDF</text>
    </g>
  </g>

  <path d="M806 170C838 170 868 170 900 170" stroke="#FFE2A6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
